<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ElectroMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">ElectroMart</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/cart}">Cart</a>
            <a class="nav-link" th:href="@{/auth/register}">Register</a>
            <a class="nav-link" th:href="@{/auth/login}">Login</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Welcome to ElectroMart</h1>
    <div class="row">
        <div class="col-md-4" th:each="product : ${products}">
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                    <p class="card-text" th:text="'$' + ${product.price}">$0.00</p>
                    <!-- Link to detail page -->
                    <a th:href="@{/products/{id}(id=${product.productId})}" class="btn btn-primary btn-sm">View Details</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
