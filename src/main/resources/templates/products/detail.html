<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ElectroMart - Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">ElectroMart</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/cart}">Cart</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card">
        <div class="card-body">
            <h2 class="card-title" th:text="${product.name}">Product Name</h2>
            <!-- Notice the .toString() here -->
            <h4 class="text-success" th:text="'$' + ${product.price.toString()}">$0.00</h4>
            <p class="card-text" th:text="'Stock: ' + ${product.stock.toString()}">Stock: 0</p>
            <p class="card-text">This is a great electronic device for your daily needs.</p>
            
            <!-- Form to add to cart -->
            <form th:action="@{/cart/add}" method="post">
                <input type="hidden" name="productId" th:value="${product.productId}">
                <button type="submit" class="btn btn-success">Add to Cart</button>
            </form>
            <a th:href="@{/}" class="btn btn-secondary mt-2">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
