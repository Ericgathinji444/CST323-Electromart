<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ElectroMart - Your Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">ElectroMart</a>
    </div>
</nav>

<div class="container mt-4">
    <h2>Your Shopping Cart</h2>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Subtotal</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- Loop through cart items -->
            <tr th:each="item : ${cartItems}">
                <td th:text="${item.productName}">Name</td>
                <td th:text="'$' + ${item.price}">$0.00</td>
                <td th:text="${item.quantity}">1</td>
                <!-- Corrected Subtotal syntax -->
                <td th:text="'$' + ${item.subtotal}">$0.00</td>
                <td>
                    <form th:action="@{/cart/remove}" method="post">
                        <input type="hidden" name="productId" th:value="${item.productId}">
                        <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                    </form>
                </td>
            </tr>
            <!-- Empty cart message -->
            <tr th:if="${#lists.isEmpty(cartItems)}">
                <td colspan="5" class="text-center">Your cart is empty!</td>
            </tr>
        </tbody>
    </table>
    
    <!-- Display Total -->
    <h4 th:if="${!#lists.isEmpty(cartItems)}" th:text="'Total: $' + ${total}">Total: $0.00</h4>
    <a th:href="@{/}" class="btn btn-primary mt-3">Continue Shopping</a>
</div>
</body>
</html>
